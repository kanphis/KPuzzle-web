    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        /*
         * The loader mirrors shared/ui/loading/LoadingScreen.kt so the
         * handoff to Compose is invisible: the themed surface background
         * (DEFAULT palette) with the app logo at 288dp pinned to the light
         * scheme, exactly as LoadingScreen draws it. Paths are AppLogo.kt's
         * launcher-foreground vector; colors are the DEFAULT light literals
         * from ThemePalettes.kt — keep all three in sync.
         *
         * It is a fixed overlay, out of the layout flow: when ComposeViewport
         * injects its canvas into body, the loader must not reflow.
         */
        body {
            background: #FBF8FF;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: #121318;
            }
        }
        #loader {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        #loader svg {
            display: block;
            width: 288px;
            height: 288px;
        }
    </style>
